name: Tournament QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Create reports directory
        run: |
          mkdir -p "$RUNNER_TEMP/qa-reports"
          echo "QA_REPORT_DIR=$RUNNER_TEMP/qa-reports" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        id: dependencies
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: npm ci

      - name: Run Newman form and HTML HTTP suite
        run: npm run test:api

      - name: Run Cypress UI suite
        id: ui
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          npm exec -- cypress install

          export PORT=3000
          node demo/server.mjs > "$RUNNER_TEMP/tournament-demo.log" 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --max-time 1 http://127.0.0.1:3000/ > /dev/null; then
              npm run test:ui -- --headless
              exit 0
            fi
            if ! kill -0 "$demo_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/tournament-demo.log"
          echo 'The tournament demo did not become reachable.' >&2
          exit 1

      - name: Upload Cypress failure evidence
        if: ${{ failure() && steps.ui.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: cypress-failure-evidence
          path: |
            cypress/screenshots/
            cypress/videos/
            ${{ runner.temp }}/tournament-demo.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize test results
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          print("### QA test results\n")
          reports = sorted(glob.glob(os.path.join(os.environ["QA_REPORT_DIR"], "*.xml")))
          if not reports:
              print("No test reports were produced. See the job log for setup errors.")
          for report in reports:
              cases = ElementTree.parse(report).getroot().findall(".//testcase")
              failed = sum(case.find("failure") is not None or case.find("error") is not None for case in cases)
              skipped = sum(case.find("skipped") is not None for case in cases)
              print(f"- {Path(report).name} — {len(cases)} cases, {failed} failed, {skipped} skipped")
          PY

      - name: Upload machine-readable test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: qa-test-reports
          path: ${{ env.QA_REPORT_DIR }}/*.xml
          if-no-files-found: ignore
          retention-days: 7
